openapi: 3.1.0
info:
  title: AIAgentPlatform Contract
  version: 1.0.0
  description: >-
    AIAgentPlatform（AI 执行面）对外与对内契约 v1.0。
    对内路径 `/api/v1/*` 仅供招聘 SaaS 使用 IR 服务凭证和 BOSS AI Grant 调用。
    不提供独立的 AI 开放面；外部系统必须先通过业务方和 BOSS 的正式授权链路。
    所有写操作必须携带 `Idempotency-Key` 与 `X-Request-Id`。
    错误信封统一为 `{ code, message, request_id }`，错误码与 BOSS 对齐。
servers:
  - url: https://ai-agent-platform.internal/api/v1
    description: 对内服务面（招聘 SaaS 直连）
security:
  - BearerAuth: []
paths:
  /agent-routes:
    post:
      operationId: routeAgentMessage
      description: >-
        返回非权威路由建议。响应不能授权执行或扩大数据访问；本次路由调用本身仍按 BOSS 授权和实际 Token 用量结算。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AiGrant"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context, message, allowed_capabilities]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                conversation_ref: { type: [string, 'null'] }
                message: { type: string, minLength: 1, maxLength: 20000 }
                allowed_capabilities:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    enum: [requirement_chat, recruitment_qa, jd_generation, resume_parsing, screening_plan_generation, candidate_screening, candidate_sourcing, job_distribution, candidate_outreach, interview_kit_generation, task_assistance]
      responses:
        "200":
          description: 路由建议
          content:
            application/json:
              schema: { $ref: "./schemas/route-decision-v2.schema.json" }
        default: { $ref: "#/components/responses/Error" }

  /capability-executions:
    post:
      operationId: createCapabilityExecution
      description: >-
        启动一个已授权的能力执行。业务方必须提供 PolicyDecision=allow 的 ExecutionContext。
      parameters:
        - $ref: "#/components/parameters/AiGrant"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/execution-context.schema.json" }
      responses:
        "202":
          description: 执行已受理
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }

  /tasks/{aiTaskId}:
    get:
      operationId: getAiTask
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 当前任务状态
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }

  /tasks/{aiTaskId}/result:
    get:
      operationId: getAiTaskResult
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 最终或最新结构化结果
          content:
            application/json:
              schema: { $ref: "./schemas/structured-result.schema.json" }
        default: { $ref: "#/components/responses/Error" }

  /tasks/{aiTaskId}/cancel:
    post:
      operationId: cancelAiTask
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 取消已受理或已解决
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，8-200 字符。同一 api_client + operation + key 返回同一受理结果。
      schema: { type: string, minLength: 8, maxLength: 200 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方追踪 ID；缺失时由服务端生成并回写响应头。
      schema: { type: string, minLength: 1, maxLength: 200 }
    AiGrant:
      name: X-AI-Grant
      in: header
      required: true
      description: BOSS 使用 RS256 签发、由 IR 原样转发的短时授权 Grant；Agent 只本地验签，不调用 BOSS。
      schema: { type: string, minLength: 20 }
  responses:
    Error:
      description: 统一错误信封
      content:
        application/json:
          schema: { $ref: "./schemas/error.schema.json" }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        对内面使用 IR 专用服务凭证。BOSS AI Grant 通过 X-AI-Grant 单独传递并校验。

# ===================== 回调（Webhook）签名规范 =====================
# AIAgentPlatform 在任务状态变更时，向业务方注册的回调地址 POST 推送 webhook-event。
# 签名算法：HMAC-SHA256(webhook_signing_secret, timestamp + "." + body)，
# 头部：X-Webhook-Signature: t=<timestamp>,s=<hex_signature>
# 时间窗口：5 分钟（300 秒），超时的回调应被拒绝。
webhooks:
  taskStatusChanged:
    post:
      operationId: onTaskStatusChanged
      description: 任务状态变更回调（started/progress/completed/failed/cancelled 等）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/webhook-event.schema.json" }
      responses:
        "200":
          description: 业务方已接收。AIAgentPlatform 对非 2xx 会重试（指数退避，最多 5 次）。
