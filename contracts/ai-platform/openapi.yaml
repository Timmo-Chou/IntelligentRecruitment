openapi: 3.1.0
info:
  title: AI Platform Contract for Intelligent Recruitment
  version: 0.3.0-draft
  description: >-
    Development contract used by the recruitment business service and its mock
    adapter. Partner review is required before v1.0.0.
servers:
  - url: https://ai-platform.example.invalid/api/v1
paths:
  /agent-routes:
    post:
      operationId: routeAgentMessage
      description: >-
        Returns a non-authoritative routing recommendation for free-form user text.
        The response cannot authorize execution, data access, or billing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context, message, allowed_capabilities]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                conversation_ref: { type: [string, 'null'] }
                message: { type: string, minLength: 1, maxLength: 20000 }
                allowed_capabilities:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    enum: [requirement_chat, recruitment_qa, jd_generation, resume_parsing, screening_plan_generation, candidate_screening, candidate_sourcing, job_distribution, candidate_outreach, interview_kit_generation, task_assistance]
      responses:
        "200":
          description: Routing recommendation
          content:
            application/json:
              schema: { $ref: "./schemas/route-decision-v2.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /capability-executions:
    post:
      operationId: createCapabilityExecution
      description: >-
        Starts one already-authorized capability execution. The business service must
        supply an ExecutionContext whose PolicyDecision is allow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/execution-context.schema.json" }
      responses:
        "202":
          description: Capability execution accepted
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /tasks/{aiTaskId}:
    get:
      operationId: getAiTask
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current task state
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /tasks/{aiTaskId}/result:
    get:
      operationId: getAiTaskResult
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Final or latest structured result for the task
          content:
            application/json:
              schema: { $ref: "./schemas/structured-result.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /tasks/{aiTaskId}/cancel:
    post:
      operationId: cancelAiTask
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation accepted or resolved
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /jd-generations:
    post:
      operationId: createJdGeneration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, requirement]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                requirement: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Generation accepted
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /resume-parse-tasks:
    post:
      operationId: createResumeParseTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, files]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                files:
                  type: array
                  minItems: 1
                  items: { $ref: "./schemas/file-reference.schema.json" }
      responses:
        "202":
          description: Parse task accepted
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /screening-tasks:
    post:
      operationId: createScreeningTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, job_version_ref, screening_plan_version_ref, candidates]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                job_version_ref: { type: string }
                screening_plan_version_ref: { type: string }
                candidates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [candidate_ref, resume_parse_version_ref]
                    properties:
                      candidate_ref: { type: string }
                      resume_parse_version_ref: { type: string }
      responses:
        "202":
          description: Screening task accepted
          content:
            application/json:
              schema: { $ref: "./schemas/task.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /interview-kit-tasks:
    post:
      operationId: createInterviewKitTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, job_version_ref, candidates]
              properties:
                context: { $ref: "./schemas/request-context.schema.json" }
                job_version_ref: { type: string }
                candidates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [candidate_ref, resume_parse_version_ref]
                    properties:
                      candidate_ref: { type: string }
                      resume_parse_version_ref: { type: string }
                      screening_result_ref: { type: string }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Error:
      description: Typed AI Platform error
      content:
        application/json:
          schema: { $ref: "./schemas/error.schema.json" }
