spring:
  application:
    name: recruitment-service
  mvc:
    async:
      # SSE 流式端点（/jd-runs/events）自身长轮询 deadline 为 55 秒，
      # 容器异步超时需略大于该值，避免 30 秒默认超时触发 AsyncRequestTimeoutException 告警。
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:65000}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/intelligent_recruitment}
    username: ${DATABASE_USERNAME:recruitment}
    password: ${DATABASE_PASSWORD:recruitment_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:recruitment}
    password: ${RABBITMQ_PASSWORD:recruitment_local}
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  auth:
    expose-mock-code: ${EXPOSE_MOCK_CODE:false}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    verification-code:
      # local：仅本地测试；aliyun：调用国内短信 SendSms。生产环境请显式设置为 aliyun。
      provider: ${VERIFICATION_CODE_PROVIDER:local}
      aliyun:
        access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
        access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
        sign-name: ${ALIYUN_SMS_SIGN_NAME:}
        template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
        endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
        connect-timeout-ms: ${ALIYUN_SMS_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${ALIYUN_SMS_READ_TIMEOUT_MS:3000}
  platform-admin-key: ${PLATFORM_ADMIN_KEY:phase2-local-admin}
  recharge:
    credit-validity-days: ${RECHARGE_CREDIT_VALIDITY_DAYS:3650}
    alipay:
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      public-key: ${ALIPAY_PUBLIC_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
  ai-platform:
    deepseek:
      # 外部模型处理默认关闭；仅在经数据处理审批的环境显式开启。
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      allow-external-data: ${DEEPSEEK_ALLOW_EXTERNAL_DATA:false}
      jd-prompt-resource: ${DEEPSEEK_JD_PROMPT_RESOURCE:classpath:prompts/jd-generation-v1.txt}
      conversation-prompt-resource: ${DEEPSEEK_CONVERSATION_PROMPT_RESOURCE:classpath:prompts/recruitment-conversation-v1.txt}
      jd-in-place-revision-prompt-resource: ${DEEPSEEK_JD_IN_PLACE_REVISION_PROMPT_RESOURCE:classpath:prompts/jd-in-place-revision-v1.txt}
      candidate-screening-prompt-resource: ${DEEPSEEK_CANDIDATE_SCREENING_PROMPT_RESOURCE:classpath:prompts/candidate-screening-v1.txt}
  ai-assistant:
    # AI咨询助手配置
    use-llm: ${AI_ASSISTANT_USE_LLM:true}
    help-manual-url: ${AI_ASSISTANT_HELP_MANUAL_URL:https://help.intelligentrecruitment.com}
    cooperation-qr-code-url: ${AI_ASSISTANT_COOPERATION_QR_CODE_URL:}
    cooperation-phone: ${AI_ASSISTANT_COOPERATION_PHONE:400-888-8888}
    cooperation-email: ${AI_ASSISTANT_COOPERATION_EMAIL:support@intelligentrecruitment.com}
  phase3:
    # Phase 3 非生产临时价：0.80元/次，正式客户启用前必须冻结价格版本。
    jd-generation-price-minor: ${JD_GENERATION_PRICE_MINOR:80}
    outbox-lease-seconds: ${JD_OUTBOX_LEASE_SECONDS:300}
    worker-enabled: ${JD_WORKER_ENABLED:true}
    worker-poll-delay-ms: ${JD_WORKER_POLL_DELAY_MS:250}
    worker-delta-delay-ms: ${JD_WORKER_DELTA_DELAY_MS:0}
    worker-completion-delay-ms: ${JD_WORKER_COMPLETION_DELAY_MS:0}
  phase5:
    # Phase 5 非生产临时价：0.80元/成功筛选候选人。
    screening-unit-price-minor: ${SCREENING_UNIT_PRICE_MINOR:80}
    pricing-version: ${SCREENING_PRICING_VERSION:SCREENING_DEEPSEEK_V1}
    quote-ttl-seconds: ${SCREENING_QUOTE_TTL_SECONDS:300}
    outbox-lease-seconds: ${SCREENING_OUTBOX_LEASE_SECONDS:300}
    worker-enabled: ${SCREENING_WORKER_ENABLED:true}
    worker-poll-delay-ms: ${SCREENING_WORKER_POLL_DELAY_MS:250}
    screening-max-in-flight-per-run: ${SCREENING_MAX_IN_FLIGHT_PER_RUN:3}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:recruitment}
    secret-key: ${S3_SECRET_KEY:recruitment_local}
    bucket: ${S3_BUCKET:resume-files}
    max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:10485760}
    # 生产环境设为 true，并在 MinIO/S3 侧启用 SSE-S3/KMS；本地开发可保持 false。
    server-side-encryption: ${S3_SERVER_SIDE_ENCRYPTION:false}
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY:phase4-local-pii-key-change-me}
    reencrypt-on-startup: ${PII_REENCRYPT_ON_STARTUP:true}
