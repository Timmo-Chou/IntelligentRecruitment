spring:
  application:
    name: recruitment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/intelligent_recruitment}
    username: ${DATABASE_USERNAME:recruitment}
    password: ${DATABASE_PASSWORD:recruitment_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:recruitment}
    password: ${RABBITMQ_PASSWORD:recruitment_local}
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  auth:
    expose-mock-code: ${EXPOSE_MOCK_CODE:false}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
  platform-admin-key: ${PLATFORM_ADMIN_KEY}
  ai-platform:
    mode: ${AI_PLATFORM_MODE:mock}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:recruitment}
    secret-key: ${S3_SECRET_KEY:recruitment_local}
    bucket: ${S3_BUCKET:resume-files}
