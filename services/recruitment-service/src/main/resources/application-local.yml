logging:
  level:
    com.intelligentrecruitment: INFO
app:
  auth:
    expose-mock-code: true
    secure-cookie: false
  platform-admin-key: ${PLATFORM_ADMIN_KEY:phase2-local-admin}
  phase3:
    # 留出可观察的异步状态和 SSE 断线重连窗口。
    worker-delta-delay-ms: ${JD_WORKER_DELTA_DELAY_MS:500}
    worker-completion-delay-ms: ${JD_WORKER_COMPLETION_DELAY_MS:800}
  phase5:
    # 为本地演示保留可观察的进度与取消窗口；生产默认不增加人工延迟。
    worker-item-delay-ms: ${SCREENING_WORKER_ITEM_DELAY_MS:500}
